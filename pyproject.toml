[project]
name = "sie-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nico (Asus)", email = "nico.luthi@epfl.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "phenobench>=0.1.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch>=2.14.0",
]

[project.scripts]
sie-project = "sie_project:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
